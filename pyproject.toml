[project]
name = "alpha-lab"
version = "0.2.0"
description = "A reproducible, notebook-friendly equity factor research framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
data = ["pyarrow>=16.0"]
market = ["yfinance>=0.2.50"]
ml = ["scikit-learn>=1.5"]
all = [
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pandas-stubs>=2.2.0",
    "pyarrow>=16.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["alpha_lab*"]
exclude = ["notebooks*"]
